name: Solar System Action
on: 
  push
  workflow dispatch



jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-test-results
          path: test-results.xml



    Test-coverage :
      name: test-coverage
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code  Test coverage
        run: npm run coverage

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifact
          path: coverage/
              
    Docker:
      name: Docker
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Test
        run: |
          docker images
          docker run -d 
          --name solar system-app /
          -p 3000:3000 \
          -e Mongo_URI=${{vars.MONGO_URI}}
          -e MONGO_USERNAME=${{vars.MONGO_USERNAME}}
          -e MONGO_PASSWORD=${{vars.MONGO_PASSWORD}}

          sleep 10
          curl http://localhost:3000/live | grep live
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/Solar-System:${{github.sha}}

